name: Require no-mistakes

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: [self-hosted, Linux, X64, king-server, cpamc]
    timeout-minutes: 5
    steps:
      - name: Verify completed pipeline for the current PR head
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@f6441c96c352a18b9cadcaef6b6c7017e9ac3970 # v1.80.1
